        attempt_id: {type: string, format: uuid}
        template: {$ref: '#/components/schemas/DashboardTemplate'}
        overrides:
          type: array
          maxItems: 4096
          items:
            type: object
            additionalProperties: false
            required: [widget_id, slot_id, sources]
            properties:
              widget_id: {type: string, minLength: 1, maxLength: 128}
              slot_id: {type: string, minLength: 1, maxLength: 128}
              sources: {type: array, minItems: 1, maxItems: 64, uniqueItems: true, items: {$ref: '#/components/schemas/DashboardWidgetSource'}}
    DashboardTemplateSlotResolution:
      type: object
      required: [widget_id, slot_id, status, candidates, selected]
      properties:
        widget_id: {type: string}
        slot_id: {type: string}
        status: {type: string, enum: [resolved, missing, ambiguous, incompatible]}
        candidates: {type: array, maxItems: 64, items: {$ref: '#/components/schemas/DashboardWidgetSource'}}
        selected: {type: array, maxItems: 64, items: {$ref: '#/components/schemas/DashboardWidgetSource'}}
    DashboardTemplateResolution:
      type: object
      required: [template_id, schema_version, template_version, attempt_id, compatibility, widgets, widget_results, slot_results]
      properties:
        template_id: {type: string}
        schema_version: {type: integer, const: 1}
        template_version: {type: integer, minimum: 0}
        attempt_id: {type: string}
        compatibility: {type: string, enum: [compatible, partially_compatible, incompatible]}
        fallback_reason: {type: string, enum: [unsupported_schema_version, unsupported_widget_type, unsupported_widget_appearance_version]}
        widgets: {type: array, maxItems: 64, items: {$ref: '#/components/schemas/DashboardWidget'}}
        widget_results:
          type: array
          maxItems: 64
          items:
            type: object
            required: [widget_id, status]
            properties:
              widget_id: {type: string}
              status: {type: string, enum: [resolved, partial, omitted, unresolved]}
        slot_results: {type: array, maxItems: 4096, items: {$ref: '#/components/schemas/DashboardTemplateSlotResolution'}}
    DashboardPreferenceWrite:
      type: object
      additionalProperties: false
      required: [schema_version, widgets]
      properties:
        schema_version: {type: integer, const: 1}
        widgets: {type: array, maxItems: 64, items: {$ref: '#/components/schemas/DashboardWidget'}}
        materialized_from:
          oneOf:
            - {$ref: '#/components/schemas/DashboardTemplateReference'}
            - {type: 'null'}
          description: Omit to preserve existing provenance; send null to detach it explicitly.
    DashboardSummary:
      type: object
      additionalProperties: false
      required: [id, name, sort_order, is_default, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 128}
        sort_order: {type: integer, minimum: 0}
        is_default: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    DashboardList:
      type: object
      additionalProperties: false
      required: [items, active_dashboard_id, default_dashboard_id]
      properties:
        items: {type: array, minItems: 1, maxItems: 32, items: {$ref: '#/components/schemas/DashboardSummary'}}
        active_dashboard_id: {type: string, minLength: 1, maxLength: 256}
        default_dashboard_id: {type: string, minLength: 1, maxLength: 256}
    DashboardCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        source_dashboard_id: {type: string, minLength: 1, maxLength: 256, description: When present, duplicate this dashboard's configuration and template provenance.}
        make_active: {type: boolean, default: true}
    DashboardUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        active: {type: boolean, description: Setting true selects this dashboard. False is ignored because one dashboard must remain active.}
        is_default: {type: boolean, description: Setting true makes this dashboard the deterministic default. False is ignored because one dashboard must remain default.}
    DashboardTemplateReference:
      type: object
      additionalProperties: false
      required: [template_id, template_version, schema_version]
      properties:
        template_id: {type: string, minLength: 1, maxLength: 128}
        template_version: {type: integer, minimum: 1}
        schema_version: {type: integer, minimum: 1}
    DashboardTemplateMaterialization:
      type: object
      additionalProperties: false
      required: [template_id, template_version, schema_version, applied_at]
      properties:
        template_id: {type: string, minLength: 1, maxLength: 128}
        template_version: {type: integer, minimum: 1}
        schema_version: {type: integer, minimum: 1}
        applied_at: {type: string, format: date-time}
    DashboardPreference:
      type: object
      required: [id, name, schema_version, widgets, sort_order, is_default, compatibility, created_at, updated_at]
      properties:
        id: {type: string, minLength: 1, maxLength: 256}
        name: {type: string, minLength: 1, maxLength: 128}
        schema_version: {type: integer, const: 1}
        widgets: {oneOf: [{type: array, maxItems: 64, items: {$ref: '#/components/schemas/DashboardWidget'}}, {type: 'null'}]}
        sort_order: {type: integer, minimum: 0}
        is_default: {type: boolean}
        compatibility: {type: string, enum: [compatible, partially_compatible, incompatible]}
        materialized_from: {oneOf: [{$ref: '#/components/schemas/DashboardTemplateMaterialization'}, {type: 'null'}]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        fallback_reason: {type: string, enum: [unsupported_schema_version, invalid_saved_configuration, unsupported_widgets_omitted, unsupported_widget_appearance_omitted]}
    ResourceSeriesResponse:
      type: object
      required: [attempt_id, cursor, from, to, resolution_seconds, truncated, points]
      properties:
        attempt_id: {type: string, format: uuid}
        cursor: {type: integer, format: int64, minimum: 0}
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        resolution_seconds: {type: integer, enum: [5, 300]}
        truncated: {type: boolean}
        points: {type: array, items: {$ref: '#/components/schemas/ResourceSample'}}
    JobTelemetrySummary:
      type: object
      required: [job_id, resources]
      properties:
        job_id: {type: string, format: uuid}
        attempt_id: {type: string, format: uuid}
        resources: {type: array, maxItems: 60, items: {$ref: '#/components/schemas/ResourceSample'}}
        progress: {type: number, format: double, minimum: 0, maximum: 1}
    JobTelemetrySummaryResponse:
      type: object
      required: [cursor, items]
      properties:
        cursor: {type: integer, format: int64, minimum: 0}
        items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/JobTelemetrySummary'}}
    LiveMetricSample:
      type: object
      required: [cursor, attempt_id, name, value, captured_at]
      properties:
        cursor: {type: integer, format: int64, minimum: 1}
        attempt_id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 128}
        step: {type: integer, format: int64}
        value: {type: number, format: double}
        captured_at: {type: string, format: date-time}
        unit: {type: string, maxLength: 64}
        tags: {$ref: '#/components/schemas/SemanticMetricTags'}
        metadata: {$ref: '#/components/schemas/ObservationMetadata'}
    SeriesUpdate:
      type: object
      required: [cursor, attempt_id, kind, captured_at]
      properties:
        cursor: {type: integer, format: int64, minimum: 1}
        attempt_id: {type: string, format: uuid}
        kind: {type: string, enum: [metrics, resources]}
        captured_at: {type: string, format: date-time}
        metrics: {type: array, items: {$ref: '#/components/schemas/LiveMetricSample'}}
        resource: {$ref: '#/components/schemas/ResourceSample'}
    AgentEnrollmentRequest:
      type: object
      additionalProperties: false
      required: [enrollment_token, node]
      properties:
        enrollment_token: {type: string, minLength: 1}
        node: {$ref: '#/components/schemas/NodeInventory'}
    AgentCredential:
      type: object
      required: [node_id, credential]
      properties:
        node_id: {type: string, format: uuid}
        credential: {type: string, writeOnly: true}
        protocol_version: {type: integer}
        rotated_at: {type: string, format: date-time}
    NodeInventory:
      type: object
      required: [name, status, agent_version, protocol_version, architecture, docker_version, cpu_total_millis, memory_total_bytes, workspace_free_bytes, labels, gpus, gpu_discovery]
      properties:
        id: {type: string}
        name: {type: string}
        status: {type: string, enum: [ONLINE, OFFLINE, DEGRADED, DRAINING]}
        agent_version: {type: string}
        protocol_version: {type: integer}
        architecture: {type: string}
        docker_version: {type: string}
        cpu_total_millis: {type: integer, format: int64, minimum: 0}
        memory_total_bytes: {type: integer, format: int64, minimum: 0}
        workspace_free_bytes: {type: integer, format: int64, minimum: 0}
        labels: {type: object, additionalProperties: {type: string}}
        gpus: {type: array, items: {$ref: '#/components/schemas/GPU'} }
        gpu_discovery: {$ref: '#/components/schemas/GPUDiscovery'}
    SecretMetadata:
      type: object
      required: [id, owner_id, name, kind, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        owner_id: {type: string, format: uuid}
        name: {type: string}
        kind: {type: string, enum: [generic, registry]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    SecretList:
      type: object
      required: [items]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/SecretMetadata'}}}
    CreateSecretRequest:
      type: object
      additionalProperties: false
      required: [name, value]
      properties:
        name: {type: string, minLength: 1}
        value: {type: string, minLength: 1, writeOnly: true}
        kind: {type: string, enum: [generic, registry], default: generic}
    AgentJobEvent:
      type: object
      additionalProperties: false
      required: [attempt_id, sequence, type]
      properties:
        attempt_id: {type: string, format: uuid}
        sequence: {type: integer, format: int64, minimum: 1}
        type: {type: string}
        status: {$ref: '#/components/schemas/JobStatus'}
        image_digest: {type: string}
        exit_code: {type: integer}
        reason: {type: string}
        payload: {type: object, additionalProperties: true}
    Assignment:
      type: object
      required: [id, job_id, attempt_id, spec, gpu_uuids, job_token, created_at, event_sequence]
      properties:
        id: {type: string, format: uuid}
        job_id: {type: string, format: uuid}
        attempt_id: {type: string, format: uuid}
        spec: {$ref: '#/components/schemas/JobSpec'}
        gpu_uuids: {type: array, items: {type: string}}
        job_token: {type: string, writeOnly: true}
        secrets: {type: object, writeOnly: true, additionalProperties: {type: string}}
        registry_auth: {type: string, writeOnly: true}
        managed_artifact: {$ref: '#/components/schemas/ManagedArtifact'}
        created_at: {type: string, format: date-time}
        event_sequence: {type: integer, format: int64, minimum: 0}
    AssignmentPoll:
      type: object
      required: [assignment, stop_job_ids, checkpoint_syncs]
      properties:
        assignment:
          oneOf:
            - {$ref: '#/components/schemas/Assignment'}
            - {type: 'null'}
        stop_job_ids: {type: array, items: {type: string, format: uuid}}
        checkpoint_syncs: {type: array, items: {$ref: '#/components/schemas/CheckpointSync'}}
    UploadAcknowledgement:
      type: object
      required: [next_offset]
      properties: {next_offset: {type: integer, format: int64, minimum: 0}}
    CheckpointFile:
      type: object
      additionalProperties: false
      required: [path, size]
      properties:
        path: {type: string}
        size: {type: integer, format: int64, minimum: 0}
    CheckpointSync:
      type: object
      required: [id, job_id, attempt_id, status, file_count, byte_count, requested_at]
      properties:
        id: {type: string, format: uuid}
        job_id: {type: string, format: uuid}
        attempt_id: {type: string, format: uuid}
        status: {type: string, enum: [PENDING, CONFIRMED]}
        file_count: {type: integer, minimum: 0}
        byte_count: {type: integer, format: int64, minimum: 0}
        requested_at: {type: string, format: date-time}
        confirmed_at: {type: string, format: date-time}
        cursor: {type: integer, format: int64, minimum: 0}
        label: {type: string}
        step: {type: integer, format: int64}
        timestamp: {type: string, format: date-time}
        metadata: {$ref: '#/components/schemas/ObservationMetadata'}
    CheckpointList:
      type: object
      required: [attempt_id, items, has_more]
      properties:
        attempt_id: {type: string, format: uuid}
        items: {type: array, maxItems: 500, items: {$ref: '#/components/schemas/CheckpointSync'}}
        has_more: {type: boolean}
    MetricBatch:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [name, value]
            properties:
              name: {type: string, minLength: 1}
              value: {type: number, format: double}
              step: {type: integer}
              timestamp: {type: string, format: date-time, description: Observation time; defaults to server receipt time for legacy clients.}
              unit: {type: string, minLength: 1, maxLength: 64}
              tags: {$ref: '#/components/schemas/SemanticMetricTags'}
              metadata: {$ref: '#/components/schemas/ObservationMetadata'}
    ObservableSourceDeclaration:
      type: object
      additionalProperties: false
      required: [name, type]
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        type: {type: string, pattern: '^[a-z][a-z0-9_.-]{0,63}$'}
        unit: {type: string, minLength: 1, maxLength: 64}
        tags: {$ref: '#/components/schemas/SemanticMetricTags'}
        metadata: {$ref: '#/components/schemas/ObservationMetadata'}
        phase: {type: string, pattern: '^[a-z][a-z0-9_.-]{0,127}$'}
        milestone: {type: string, minLength: 1, maxLength: 128}
    ObservabilityManifest:
      type: object
      additionalProperties: false
      required: [version]
      anyOf:
        - {required: [sources]}
        - {required: [phases]}
      properties:
        version: {type: integer, enum: [1]}
        sources:
          type: array
          minItems: 1
          maxItems: 256
          description: Unique by name. The complete encoded manifest is limited to 256 KiB.
          items: {$ref: '#/components/schemas/ObservableSourceDeclaration'}
        phases:
          type: array
          minItems: 1
          maxItems: 128
          items: {$ref: '#/components/schemas/ObservabilityPhase'}
    ObservabilityPhase:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: {type: string, pattern: '^[a-z][a-z0-9_.-]{0,127}$'}
        name: {type: string, minLength: 1, maxLength: 128}
        order: {type: integer, minimum: 0, maximum: 4096}
        metadata: {$ref: '#/components/schemas/ObservationMetadata'}
    ObservabilityManifestUpdate:
      type: object
      required: [sources_added, phases_added]
      properties:
        sources_added: {type: array, maxItems: 256, items: {type: string}}
        phases_added: {type: array, maxItems: 128, items: {type: string}}
    SemanticMetricTags:
      type: array
      maxItems: 32
      uniqueItems: true
      description: Canonical lowercase semantic dimensions stored once on the attempt-scoped metric series descriptor. Standard and custom tags use namespace:value syntax.
      items:
        type: string
        minLength: 3
        maxLength: 97
        pattern: '^[a-z][a-z0-9_.-]{0,31}:[a-z0-9][a-z0-9_.-]{0,63}$'
    SemanticMetricRole:
      type: object
      required: [id, name, description]
      properties:
        id: {type: string}
        name: {type: string}
        description: {type: string}
        recommended_unit: {type: string}
        optimization_direction: {type: string, enum: [minimize, maximize]}
    SemanticMetricCategory:
      type: object
      required: [id, name, description, roles]
      properties:
        id: {type: string}
        name: {type: string}
        description: {type: string}
        roles: {type: array, minItems: 1, items: {$ref: '#/components/schemas/SemanticMetricRole'}}
    SemanticPhase:
      type: object
      required: [id, name, description]
      properties:
        id: {type: string}
        name: {type: string}
        description: {type: string}
    ObservabilityCatalog:
      type: object
      required: [version, metric_categories, phases]
      properties:
        version: {type: integer, minimum: 1}
        metric_categories: {type: array, minItems: 1, items: {$ref: '#/components/schemas/SemanticMetricCategory'}}
        phases: {type: array, minItems: 1, items: {$ref: '#/components/schemas/SemanticPhase'}}
    ObservationMetadata:
      type: object
      maxProperties: 64
      description: Portable JSON metadata bounded to 16 KiB, four nesting levels and 64 total keys.
      additionalProperties: true
    ObservationContext:
      type: object
      properties:
        step: {type: integer, format: int64}
        timestamp: {type: string, format: date-time}
        metadata: {$ref: '#/components/schemas/ObservationMetadata'}
    CheckpointObservation:
      allOf:
        - {$ref: '#/components/schemas/ObservationContext'}
        - {type: object, properties: {label: {type: string, maxLength: 128}}}
    Milestone:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        weight: {type: number, format: double, exclusiveMinimum: 0}
        metadata: {$ref: '#/components/schemas/ObservationMetadata'}
    ProgressObservation:
      allOf:
        - {$ref: '#/components/schemas/ObservationContext'}
        - {type: object, required: [value], properties: {value: {type: number, format: double, minimum: 0, maximum: 1}, milestone: {type: string}}}
    MatrixObservation:
      allOf:
        - {$ref: '#/components/schemas/ObservationContext'}
        - type: object
          required: [name, values]
          properties:
            id: {type: integer, format: int64}
            attempt_id: {type: string, format: uuid}
            name: {type: string, minLength: 1, maxLength: 128}
            values: {type: array, minItems: 1, maxItems: 128, items: {type: array, minItems: 1, maxItems: 128, items: {type: number, format: double}}}
            labels: {type: array, minItems: 1, maxItems: 128, items: {type: string, minLength: 1, maxLength: 128}}
    MatrixList:
      type: object
      required: [attempt_id, items]
      properties:
        attempt_id: {type: string, format: uuid}
        items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/MatrixObservation'}}
    DistributionObservationWrite:
      allOf:
        - {$ref: '#/components/schemas/ObservationContext'}
        - type: object
          required: [name, values]
          properties:
            name: {type: string, minLength: 1, maxLength: 128}
            group: {type: string, minLength: 1, maxLength: 128, default: default}
            unit: {type: string, minLength: 1, maxLength: 64}
            values: {type: array, minItems: 1, maxItems: 4096, items: {type: number, format: double}}
            scores: {type: object, maxProperties: 32, additionalProperties: {type: number, format: double}}
            tags: {type: array, maxItems: 32, uniqueItems: true, items: {type: string}}
    DistributionSummary:
      type: object
      required: [count, min, q1, median, q3, max, mean, whisker_low, whisker_high, outliers]
      properties:
        count: {type: integer, minimum: 1}
        min: {type: number}
        q1: {type: number}
        median: {type: number}
        q3: {type: number}
        max: {type: number}
        mean: {type: number}
        whisker_low: {type: number}
        whisker_high: {type: number}
        outliers: {type: array, maxItems: 128, items: {type: number}}
    DistributionView:
      type: object
      required: [id, name, group, samples, bins, density, summary]
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        group: {type: string}
        unit: {type: string}
        step: {type: integer, format: int64}
        timestamp: {type: string, format: date-time}
        samples: {type: array, maxItems: 512, items: {type: number}}
        bins: {type: array, maxItems: 256, items: {type: object, required: [lower, upper, count], properties: {lower: {type: number}, upper: {type: number}, count: {type: integer, minimum: 0}}}}
        density: {type: array, maxItems: 256, items: {type: object, required: [x, density], properties: {x: {type: number}, density: {type: number, minimum: 0, maximum: 1}}}}
        summary: {$ref: '#/components/schemas/DistributionSummary'}
        scores: {type: object, additionalProperties: {type: number}}
        tags: {type: array, items: {type: string}}
        metadata: {$ref: '#/components/schemas/ObservationMetadata'}
    DistributionList:
      type: object
      required: [attempt_id, items]
      properties:
        attempt_id: {type: string, format: uuid}
        items: {type: array, maxItems: 512, items: {$ref: '#/components/schemas/DistributionView'}}
    ProgressState:
      type: object
      required: [attempt_id, milestones, reached]
      properties:
        attempt_id: {type: string, format: uuid}
        simple: {$ref: '#/components/schemas/ProgressObservation'}
        current: {$ref: '#/components/schemas/ProgressObservation'}
        milestones: {type: array, items: {$ref: '#/components/schemas/Milestone'}}
        reached: {type: array, items: {type: string}}
        global_progress: {type: number, minimum: 0, maximum: 1}
        updated_at: {type: string, format: date-time}
    ParameterBatch:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [name, value]
            properties:
              name: {type: string, minLength: 1}
              value: {oneOf: [{type: string}, {type: integer}, {type: number}, {type: boolean}]}
    SDKEvent:
      type: object
      additionalProperties: false
      required: [type, payload]
      properties:
        type: {type: string, minLength: 1}
        payload: {type: object, additionalProperties: true}
    Problem:
      type: object
      required: [type, title, status, code, detail]
      properties: {type: {type: string, format: uri}, title: {type: string}, status: {type: integer}, code: {type: string}, detail: {type: string}}
