openapi: 3.1.0
info:
  title: JobDock API
  version: 0.1.0
  description: Versioned control-plane API for JobDock users, agents, and running jobs.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
paths:
  /auth/login:
    post:
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200': {description: Authenticated session, content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}}
        '401': {$ref: '#/components/responses/Problem'}
  /auth/me:
    get:
      operationId: currentUser
      responses:
        '200': {description: Current session, content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}}
  /auth/logout:
    post:
      operationId: logout
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      responses: {'204': {description: Session revoked and cookie cleared}}
  /auth/tokens:
    get:
      operationId: listPersonalAccessTokens
      description: List personal access token metadata. Token secrets are never returned.
      responses:
        '200': {description: Personal access tokens and supported scopes, content: {application/json: {schema: {$ref: '#/components/schemas/PersonalAccessTokenList'}}}}
    post:
      operationId: createPersonalAccessToken
      description: Create a scoped personal access token. The plaintext token is returned exactly once.
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreatePersonalAccessTokenRequest'}}}
      responses:
        '201': {description: Newly created token and its one-time secret, content: {application/json: {schema: {$ref: '#/components/schemas/CreatePersonalAccessTokenResponse'}}}}
        '422': {$ref: '#/components/responses/Problem'}
  /auth/tokens/{tokenId}:
    parameters: [{name: tokenId, in: path, required: true, schema: {type: string, format: uuid}}]
    delete:
      operationId: revokePersonalAccessToken
      description: Idempotently revoke one token owned by the current user.
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      responses:
        '204': {description: Token revoked}
        '404': {$ref: '#/components/responses/Problem'}
  /users:
    get:
      operationId: listUsers
      description: Administrator-only user listing.
      responses:
        '200': {description: Users, content: {application/json: {schema: {$ref: '#/components/schemas/UserList'}}}}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      operationId: createUser
      description: Create a local administrator or member account.
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateUserRequest'}}}
      responses:
        '201': {description: Created user, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /builds:
    get:
      operationId: listBuilds
      description: List builds visible to the current user. Administrators can see all builds.
      responses:
        '200': {description: Visible builds, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/Build'}}}}}}}
    post:
      operationId: createBuild
      description: Persist one immutable source archive and, in RAILPACK mode, analyze it with Railpack prepare.
      parameters: [{$ref: '#/components/parameters/CSRFToken'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [metadata, source]
              properties:
                metadata:
                  type: string
                  contentMediaType: application/json
                  description: JSON containing name, mode (RAILPACK or DOCKERFILE), and optional Dockerfile context_path/dockerfile_path.
                source: {type: string, format: binary, description: Immutable .zip, .tar.gz, or .tgz source archive bytes.}
      responses:
        '201': {description: Created source build, content: {application/json: {schema: {$ref: '#/components/schemas/Build'}}}}
        '413': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /builds/{buildId}:
    parameters: [{$ref: '#/components/parameters/BuildID'}]
    get:
      operationId: getBuild
      responses:
        '200': {description: Build detail including source identity, lifecycle and immutable OCI result, content: {application/json: {schema: {$ref: '#/components/schemas/Build'}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    delete:
      operationId: deleteBuild
      description: Permanently delete an inactive build and its stored source, logs, plan and managed artifact. Managed images referenced by non-deleted jobs cannot be deleted.
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      responses:
        '204': {description: Build deleted}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /builds/{buildId}/events:
    get:
      operationId: listBuildEvents
      parameters: [{$ref: '#/components/parameters/BuildID'}]
      responses:
        '200': {description: Ordered build lifecycle history, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/BuildEvent'}}}}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /builds/{buildId}/plan:
    get:
      operationId: getBuildPlan
      description: Return the persisted Railpack plan, build information and normalized detected summary.
      parameters: [{$ref: '#/components/parameters/BuildID'}]
      responses:
        '200': {description: Detected build plan, content: {application/json: {schema: {$ref: '#/components/schemas/BuildPlan'}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /builds/{buildId}/logs:
    get:
      operationId: getBuildLogs
      parameters:
        - {$ref: '#/components/parameters/BuildID'}
        - {name: offset, in: query, schema: {type: integer, format: int64, minimum: 0, default: 0}}
        - {name: limit, in: query, schema: {type: integer, format: int64, minimum: 1, maximum: 4194304, default: 1048576}}
      responses:
        '200':
          description: Bounded build log bytes beginning at the requested offset.
          headers:
            X-JobDock-Start-Offset: {schema: {type: integer, format: int64}}
            X-JobDock-Next-Offset: {schema: {type: integer, format: int64}}
          content: {text/plain: {schema: {type: string}}}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /builds/{buildId}/cancel:
    post:
      operationId: cancelBuild
      parameters: [{$ref: '#/components/parameters/BuildID'}, {$ref: '#/components/parameters/CSRFToken'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '202': {description: Build cancelled, content: {application/json: {schema: {$ref: '#/components/schemas/Build'}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /builds/{buildId}/confirm:
    post:
      operationId: confirmBuildPlan
      description: Confirm the immutable configuration and queue it for isolated BuildKit execution.
      parameters: [{$ref: '#/components/parameters/BuildID'}, {$ref: '#/components/parameters/CSRFToken'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '202': {description: Build queued for the isolated builder, content: {application/json: {schema: {$ref: '#/components/schemas/Build'}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /builder/assignments/next:
    get:
      security: [{bearerToken: []}]
      operationId: claimBuildAssignment
      parameters: [{$ref: '#/components/parameters/BuilderID'}]
      responses:
        '200': {description: Persisted build work claimed or recovered by this builder, content: {application/json: {schema: {$ref: '#/components/schemas/BuildWork'}}}}
        '204': {description: No build work is available}
        '401': {$ref: '#/components/responses/Problem'}
  /builder/assignments/{assignmentId}:
    get:
      security: [{bearerToken: []}]
      operationId: getBuildAssignment
      parameters: [{$ref: '#/components/parameters/BuildAssignmentID'}, {$ref: '#/components/parameters/BuilderID'}]
      responses:
        '200': {description: Current desired and observed assignment state, content: {application/json: {schema: {$ref: '#/components/schemas/BuildAssignment'}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /builder/assignments/{assignmentId}/heartbeat:
    post:
      security: [{bearerToken: []}]
      operationId: heartbeatBuildAssignment
      parameters: [{$ref: '#/components/parameters/BuildAssignmentID'}, {$ref: '#/components/parameters/BuilderID'}]
      responses:
        '200': {description: Renewed lease and cancellation state, content: {application/json: {schema: {$ref: '#/components/schemas/BuildAssignment'}}}}
        '409': {$ref: '#/components/responses/Problem'}
  /builder/assignments/{assignmentId}/source:
    get:
      security: [{bearerToken: []}]
      operationId: downloadBuildSource
      parameters: [{$ref: '#/components/parameters/BuildAssignmentID'}, {$ref: '#/components/parameters/BuilderID'}]
      responses:
        '200': {description: Exact immutable source archive, headers: {X-JobDock-Source-SHA256: {schema: {type: string, pattern: '^[0-9a-f]{64}$'}}}, content: {application/octet-stream: {schema: {type: string, format: binary}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /builder/assignments/{assignmentId}/logs:
    put:
      security: [{bearerToken: []}]
      operationId: uploadBuildLogChunk
      parameters: [{$ref: '#/components/parameters/BuildAssignmentID'}, {$ref: '#/components/parameters/BuilderID'}, {$ref: '#/components/parameters/UploadOffset'}]
      requestBody: {required: true, content: {application/octet-stream: {schema: {type: string, format: binary}}}}
      responses:
        '204': {description: Ordered log chunk acknowledged, headers: {X-JobDock-Next-Offset: {schema: {type: integer, format: int64}}}}
        '409': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
  /builder/assignments/{assignmentId}/artifact:
    put:
      security: [{bearerToken: []}]
      operationId: publishManagedBuildArtifact
      parameters: [{$ref: '#/components/parameters/BuildAssignmentID'}, {$ref: '#/components/parameters/BuilderID'}]
      requestBody: {required: true, content: {application/vnd.jobdock.image.archive.v1+tar: {schema: {type: string, format: binary}}}}
      responses:
        '200': {description: Existing identical managed artifact confirmed, content: {application/json: {schema: {$ref: '#/components/schemas/ManagedArtifact'}}}}
        '201': {description: Managed artifact stored atomically, content: {application/json: {schema: {$ref: '#/components/schemas/ManagedArtifact'}}}}
        '409': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
  /builder/assignments/{assignmentId}/complete:
    post:
      security: [{bearerToken: []}]
      operationId: completeBuildAssignment
      parameters: [{$ref: '#/components/parameters/BuildAssignmentID'}, {$ref: '#/components/parameters/BuilderID'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: {type: string, enum: [SUCCEEDED, FAILED, CANCELLED]}
                digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
                message: {type: string, maxLength: 65536}
      responses:
        '200': {description: Terminal result committed idempotently, content: {application/json: {schema: {$ref: '#/components/schemas/Build'}}}}
        '409': {$ref: '#/components/responses/Problem'}
  /agent/assignments/{assignmentId}/artifact:
    get:
      security: [{bearerToken: []}]
      operationId: downloadManagedArtifact
      parameters: [{$ref: '#/components/parameters/BuildAssignmentID'}]
      responses:
        '200': {description: Authorized immutable image archive for the assigned job, content: {application/vnd.jobdock.image.archive.v1+tar: {schema: {type: string, format: binary}}}}
        '404': {$ref: '#/components/responses/Problem'}
  /jobs:
    get:
      security: [{sessionCookie: []}, {personalAccessToken: []}]
      operationId: listJobs
      responses:
        '200': {description: Visible jobs, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/Job'}}}}}}}
    post:
      security: [{sessionCookie: []}, {personalAccessToken: []}]
      operationId: createJob
      parameters: [{$ref: '#/components/parameters/CSRFToken'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/JobSpec'}}
          multipart/form-data:
            schema:
              type: object
              description: The spec field contains JobSpec JSON. Each file field is named input:<relative-path>.
              required: [spec]
              properties:
                spec: {type: string, contentMediaType: application/json}
              additionalProperties: {type: string, format: binary}
      responses:
        '201': {description: Queued job, content: {application/json: {schema: {$ref: '#/components/schemas/Job'}}}}
        '413': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /jobs/telemetry-summaries:
    get:
      security: [{sessionCookie: []}, {personalAccessToken: []}]
      operationId: listJobTelemetrySummaries
      description: Return bounded recent resource points and current SDK progress for up to 100 visible jobs. Passing after returns only resource points newer than the shared series cursor.
      parameters:
        - {name: job_id, in: query, required: true, schema: {type: array, minItems: 1, maxItems: 100, items: {type: string, format: uuid}}, style: form, explode: true}
        - {name: points, in: query, schema: {type: integer, minimum: 2, maximum: 60, default: 24}}
        - {name: after, in: query, schema: {type: integer, format: int64, minimum: 0}}
      responses:
        '200': {description: Authorized list telemetry summary, content: {application/json: {schema: {$ref: '#/components/schemas/JobTelemetrySummaryResponse'}}}}
        '422': {$ref: '#/components/responses/Problem'}
  /jobs/{jobId}:
    parameters: [{$ref: '#/components/parameters/JobID'}]
    get:
      security: [{sessionCookie: []}, {personalAccessToken: []}]
      operationId: getJob
      responses:
        '200': {description: Job detail, content: {application/json: {schema: {$ref: '#/components/schemas/Job'}}}}
    delete:
      operationId: deleteJob
      parameters: [{$ref: '#/components/parameters/CSRFToken'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'202': {description: Deletion accepted}, '409': {$ref: '#/components/responses/Problem'}}
  /jobs/{jobId}/stop:
    post:
      security: [{sessionCookie: []}, {personalAccessToken: []}]
      operationId: stopJob
      parameters: [{$ref: '#/components/parameters/JobID'}, {$ref: '#/components/parameters/CSRFToken'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'202': {description: Stop accepted}, '409': {$ref: '#/components/responses/Problem'}}
  /jobs/{jobId}/rerun:
    post:
      operationId: rerunJob
      description: Queue the same immutable JobSpec for a new numbered attempt. Only terminal jobs can be rerun.
      parameters: [{$ref: '#/components/parameters/JobID'}, {$ref: '#/components/parameters/CSRFToken'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '202': {description: Job queued for another attempt, content: {application/json: {schema: {$ref: '#/components/schemas/Job'}}}}
        '409': {$ref: '#/components/responses/Problem'}
  /jobs/{jobId}/attempts:
    get:
      operationId: listJobAttempts
      parameters: [{$ref: '#/components/parameters/JobID'}]
      responses:
        '200': {description: Newest-first execution history, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/JobAttempt'}}}}}}}
  /jobs/{jobId}/attempts/{attemptId}/archive.zip:
    get:
      operationId: downloadJobAttemptArchive
      parameters: [{$ref: '#/components/parameters/JobID'}, {$ref: '#/components/parameters/AttemptIDPath'}]
      responses:
        '200': {description: Attempt-scoped logs, outputs, immutable inputs and metadata, content: {application/zip: {schema: {type: string, format: binary}}}}
        '404': {$ref: '#/components/responses/Problem'}
  /jobs/{jobId}/attempts/{attemptId}/outputs/{path}:
    get:
      operationId: downloadJobAttemptOutput
      description: Download one regular output file declared by the selected attempt.
      parameters: [{$ref: '#/components/parameters/JobID'}, {$ref: '#/components/parameters/AttemptIDPath'}, {name: path, in: path, required: true, schema: {type: string, minLength: 1}}]
      responses:
        '200': {description: Attempt output, content: {application/octet-stream: {schema: {type: string, format: binary}}}}
        '404': {$ref: '#/components/responses/Problem'}
  /jobs/{jobId}/events:
    get:
      operationId: listJobEvents
      parameters: [{$ref: '#/components/parameters/JobID'}, {$ref: '#/components/parameters/AttemptIDQuery'}, {name: after, in: query, schema: {type: integer, format: int64}}, {name: download, in: query, schema: {type: boolean, default: false}}]
      responses: {'200': {description: Ordered job events}}
  /jobs/{jobId}/metrics:
    get:
      operationId: getJobMetrics
      description: Query bounded, attempt-scoped SDK metric series. Auto resolution downsamples on the server.
      parameters:
        - {$ref: '#/components/parameters/JobID'}
        - {$ref: '#/components/parameters/AttemptIDQuery'}
        - {$ref: '#/components/parameters/SeriesFrom'}
        - {$ref: '#/components/parameters/SeriesTo'}
        - {$ref: '#/components/parameters/SeriesLimit'}
        - {$ref: '#/components/parameters/SeriesCursor'}
        - {name: name, in: query, description: Repeat to select up to 64 metric names, schema: {type: array, maxItems: 64, items: {type: string}}}
        - {name: resolution, in: query, schema: {type: string, enum: [auto, raw, 1m, 5m], default: auto}}
        - {name: format, in: query, schema: {type: string, enum: [json, csv], default: json}}
      responses:
        '200': {description: Metric series or CSV export, content: {application/json: {schema: {$ref: '#/components/schemas/MetricSeriesResponse'}}, text/csv: {schema: {type: string}}}}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /jobs/{jobId}/metrics/catalog:
    get:
      operationId: getJobMetricCatalog
      description: List bounded attempt-scoped metric descriptors without downloading sample history. Repeated tag filters use AND semantics.
      parameters:
        - {$ref: '#/components/parameters/JobID'}
        - {$ref: '#/components/parameters/AttemptIDQuery'}
        - {name: tag, in: query, description: Repeat up to 32 canonical semantic tags; every tag must match., style: form, explode: true, schema: {$ref: '#/components/schemas/SemanticMetricTags'}}
      responses:
        '200': {description: Attempt metric descriptors, content: {application/json: {schema: {$ref: '#/components/schemas/MetricDescriptorList'}}}}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /jobs/{jobId}/observability/catalog:
    get:
      operationId: getJobObservabilityCatalog
      description: List the bounded attempt-scoped union of declared and observed sources without loading telemetry history.
      parameters:
        - {$ref: '#/components/parameters/JobID'}
        - {$ref: '#/components/parameters/AttemptIDQuery'}
      responses:
        '200': {description: Attempt observable-source catalog, content: {application/json: {schema: {$ref: '#/components/schemas/ObservableSourceDescriptorList'}}}}
        '404': {$ref: '#/components/responses/Problem'}
  /dashboard/templates:
    get:
      operationId: listDashboardTemplates
      description: Return the product-maintained, framework-neutral dashboard template catalog.
      responses:
        '200': {description: Built-in dashboard templates, content: {application/json: {schema: {$ref: '#/components/schemas/DashboardTemplateList'}}}}
  /observability/catalog:
    get:
      operationId: getObservabilityCatalog
      description: Return the versioned standard metric-role and lifecycle-phase catalog. Custom semantic tags remain supported.
      responses:
        '200': {description: Official observability semantics, content: {application/json: {schema: {$ref: '#/components/schemas/ObservabilityCatalog'}}}}
  /jobs/{jobId}/dashboard/templates/matches:
    get:
      operationId: matchJobDashboardTemplates
      description: Match every official template against one attempt using a single bounded descriptor-catalog read.
      parameters: [{$ref: '#/components/parameters/JobID'}, {$ref: '#/components/parameters/AttemptIDQuery'}]
      responses:
        '200': {description: Template applicability summaries, content: {application/json: {schema: {$ref: '#/components/schemas/DashboardTemplateMatchList'}}}}
        '404': {$ref: '#/components/responses/Problem'}
  /jobs/{jobId}/dashboard/templates/resolve:
    post:
      operationId: resolveJobDashboardTemplate
      description: Resolve a versioned declarative template against one attempt's bounded observable-source catalog without reading samples or changing telemetry.
      parameters: [{$ref: '#/components/parameters/JobID'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DashboardTemplateResolveRequest'}}}}
      responses:
        '200': {description: Deterministic slot diagnostics and materialized dashboard widgets, content: {application/json: {schema: {$ref: '#/components/schemas/DashboardTemplateResolution'}}}}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /jobs/{jobId}/dashboard:
    get:
      operationId: getJobDashboard
      description: Return the current user's versioned dashboard configuration for this job. Unsupported saved schemas safely return a default fallback.
      parameters: [{$ref: '#/components/parameters/JobID'}]
      responses:
        '200': {description: Saved dashboard or an explicit fallback, content: {application/json: {schema: {$ref: '#/components/schemas/DashboardPreference'}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    put:
      operationId: putJobDashboard
      description: Atomically persist layout, widget types and source configuration for the current user and job.
      parameters: [{$ref: '#/components/parameters/JobID'}, {$ref: '#/components/parameters/CSRFToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DashboardPreferenceWrite'}}}}
      responses:
        '200': {description: Persisted dashboard, content: {application/json: {schema: {$ref: '#/components/schemas/DashboardPreference'}}}}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /jobs/{jobId}/dashboards:
    get:
      operationId: listJobDashboards
      description: List the current user's independent dashboards for a job and identify the active and default dashboards. Dashboard configuration is job-scoped; observable availability remains attempt-scoped.
      parameters: [{$ref: '#/components/parameters/JobID'}]
      responses:
        '200': {description: Ordered dashboard summaries, content: {application/json: {schema: {$ref: '#/components/schemas/DashboardList'}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    post:
      operationId: createJobDashboard
      description: Create an empty dashboard or duplicate an existing dashboard configuration without copying telemetry.
      parameters: [{$ref: '#/components/parameters/JobID'}, {$ref: '#/components/parameters/CSRFToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DashboardCreate'}}}}
      responses:
        '201': {description: Created dashboard, content: {application/json: {schema: {$ref: '#/components/schemas/DashboardPreference'}}}}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /jobs/{jobId}/dashboards/{dashboardId}:
    parameters:
      - {$ref: '#/components/parameters/JobID'}
      - {name: dashboardId, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 256}}
    get:
      operationId: getJobDashboardById
      responses:
        '200': {description: Dashboard configuration, content: {application/json: {schema: {$ref: '#/components/schemas/DashboardPreference'}}}}
        '404': {$ref: '#/components/responses/Problem'}
    put:
      operationId: putJobDashboardById
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DashboardPreferenceWrite'}}}}
      responses:
        '200': {description: Persisted dashboard, content: {application/json: {schema: {$ref: '#/components/schemas/DashboardPreference'}}}}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
    patch:
      operationId: patchJobDashboard
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DashboardUpdate'}}}}
      responses:
        '200': {description: Updated dashboard, content: {application/json: {schema: {$ref: '#/components/schemas/DashboardPreference'}}}}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
    delete:
      operationId: deleteJobDashboard
      description: Delete a dashboard. The final dashboard cannot be deleted; active/default fallback is deterministic.
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      responses:
        '204': {description: Dashboard deleted}
        '409': {$ref: '#/components/responses/Problem'}
  /jobs/{jobId}/checkpoints:
    get:
      operationId: listJobCheckpoints
      parameters: [{$ref: '#/components/parameters/JobID'}, {$ref: '#/components/parameters/AttemptIDQuery'}, {name: after, in: query, schema: {type: integer, format: int64, minimum: 0}}, {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500}}]
      responses: {'200': {description: Bounded confirmed checkpoints for one attempt, content: {application/json: {schema: {$ref: '#/components/schemas/CheckpointList'}}}}}
  /jobs/{jobId}/progress:
    get:
      operationId: getJobProgress
      parameters: [{$ref: '#/components/parameters/JobID'}, {$ref: '#/components/parameters/AttemptIDQuery'}]
      responses: {'200': {description: Attempt-scoped simple, segment, milestone and computed global progress, content: {application/json: {schema: {$ref: '#/components/schemas/ProgressState'}}}}}
  /jobs/{jobId}/matrices:
    get:
      operationId: listJobMatrices
      parameters: [{$ref: '#/components/parameters/JobID'}, {$ref: '#/components/parameters/AttemptIDQuery'}, {name: name, in: query, schema: {type: string}}, {name: step, in: query, schema: {type: integer, format: int64}}]
      responses: {'200': {description: Latest matrices by name or matrices selected by step, content: {application/json: {schema: {$ref: '#/components/schemas/MatrixList'}}}}}
  /jobs/{jobId}/distributions:
    get:
      operationId: listJobDistributions
      description: Return the latest bounded distribution snapshot per name and group with server-derived bins, quantiles, density, whiskers, and bounded outliers.
      parameters: [{$ref: '#/components/parameters/JobID'}, {$ref: '#/components/parameters/AttemptIDQuery'}, {name: name, in: query, schema: {type: string}}, {name: group, in: query, schema: {type: string}}, {name: bins, in: query, schema: {oneOf: [{type: string, enum: [auto]}, {type: integer, minimum: 2, maximum: 256}]}}]
      responses: {'200': {description: Attempt-scoped compact distribution views, content: {application/json: {schema: {$ref: '#/components/schemas/DistributionList'}}}}, '422': {$ref: '#/components/responses/Problem'} }
  /jobs/{jobId}/observations/stream:
    get:
      operationId: streamJobObservations
      parameters: [{$ref: '#/components/parameters/JobID'}, {$ref: '#/components/parameters/AttemptIDQuery'}, {name: after, in: query, description: Resume cursor or latest to receive only new observations, schema: {oneOf: [{type: integer, format: int64, minimum: 0}, {type: string, enum: [latest]}]}}, {name: Last-Event-ID, in: header, schema: {type: integer, format: int64, minimum: 0}}]
      responses: {'200': {description: Resumable checkpoint, progress and matrix update stream}}
  /jobs/{jobId}/attempts/{attemptId}/checkpoints/{syncId}/archive.zip:
    get:
      operationId: downloadCheckpointArchive
      parameters: [{$ref: '#/components/parameters/JobID'}, {$ref: '#/components/parameters/AttemptIDPath'}, {name: syncId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Files from one confirmed checkpoint, content: {application/zip: {schema: {type: string, format: binary}}}}, '404': {$ref: '#/components/responses/Problem'}}
  /jobs/{jobId}/resources:
    get:
      operationId: getJobResources
      description: Query bounded CPU, memory, GPU utilization and GPU memory samples for one attempt.
      parameters:
        - {$ref: '#/components/parameters/JobID'}
        - {$ref: '#/components/parameters/AttemptIDQuery'}
        - {$ref: '#/components/parameters/SeriesFrom'}
        - {$ref: '#/components/parameters/SeriesTo'}
        - {$ref: '#/components/parameters/SeriesLimit'}
        - {$ref: '#/components/parameters/SeriesCursor'}
        - {name: resolution, in: query, schema: {type: string, enum: [auto, 5s, 5m], default: auto}}
        - {name: format, in: query, schema: {type: string, enum: [json, csv], default: json}}
      responses:
        '200': {description: Resource samples or CSV export, content: {application/json: {schema: {$ref: '#/components/schemas/ResourceSeriesResponse'}}, text/csv: {schema: {type: string}}}}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /jobs/{jobId}/series/stream:
    get:
      operationId: streamJobSeries
      description: Resumable attempt-scoped stream of newly persisted metric and resource batches. Event IDs are common series cursors.
      parameters:
        - {$ref: '#/components/parameters/JobID'}
        - {$ref: '#/components/parameters/AttemptIDQuery'}
        - {name: after, in: query, description: Resume strictly after this cursor, schema: {oneOf: [{type: integer, format: int64, minimum: 0}, {type: string, const: latest}], default: 0}}
        - {name: Last-Event-ID, in: header, description: Last applied series cursor used by automatic SSE reconnection, schema: {type: integer, format: int64, minimum: 0}}
      responses:
        '200': {description: SeriesUpdate events as text/event-stream, content: {text/event-stream: {schema: {$ref: '#/components/schemas/SeriesUpdate'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /jobs/{jobId}/stream:
    get:
      operationId: streamJob
      parameters: [{$ref: '#/components/parameters/JobID'}]
      responses: {'200': {description: Resumable text/event-stream}}
  /jobs/{jobId}/logs/{stream}/tail:
    get:
      operationId: tailJobLogs
      parameters:
        - {$ref: '#/components/parameters/JobID'}
        - {$ref: '#/components/parameters/AttemptIDQuery'}
        - {name: stream, in: path, required: true, schema: {type: string, enum: [stdout, stderr, combined]}}
        - {name: after, in: query, schema: {oneOf: [{type: integer, format: int64, minimum: 0}, {type: string, const: tail}], default: tail}}
        - {name: Last-Event-ID, in: header, description: Last acknowledged byte offset used for automatic SSE reconnection, schema: {type: integer, format: int64, minimum: 0}}
      responses:
        '200': {description: Byte-offset resumable log chunks as text/event-stream}
        '400': {$ref: '#/components/responses/Problem'}
  /jobs/{jobId}/logs/{stream}:
    get:
      security: [{sessionCookie: []}, {personalAccessToken: []}]
      operationId: downloadJobLog
      parameters:
        - {$ref: '#/components/parameters/JobID'}
        - {$ref: '#/components/parameters/LogStream'}
        - {$ref: '#/components/parameters/AttemptIDQuery'}
        - {name: offset, in: query, schema: {type: integer, format: int64, minimum: 0}}
      responses:
        '200':
          description: Log bytes beginning at the requested offset, or the last 256 KiB by default.
          headers:
            X-JobDock-Start-Offset: {schema: {type: integer, format: int64}}
            X-JobDock-Next-Offset: {schema: {type: integer, format: int64}}
          content: {text/plain: {schema: {type: string}}}
        '422': {$ref: '#/components/responses/Problem'}
  /jobs/stream:
    get:
      operationId: streamOwnedJobs
      parameters:
        - {name: scope, in: query, schema: {type: string, enum: [mine], default: mine}}
        - {name: after, in: query, schema: {type: integer, format: int64}}
      responses: {'200': {description: Resumable owner-scoped job status text/event-stream}}
  /jobs/{jobId}/archive.zip:
    get:
      security: [{sessionCookie: []}, {personalAccessToken: []}]
      operationId: downloadJobArchive
      parameters: [{$ref: '#/components/parameters/JobID'}]
      responses: {'200': {description: Streaming ZIP archive, content: {application/zip: {schema: {type: string, format: binary}}}}}
  /jobs/{jobId}/checkpoints/latest.zip:
    get:
      operationId: downloadLatestCheckpoint
      parameters: [{$ref: '#/components/parameters/JobID'}]
      responses:
        '200': {description: Latest fully confirmed checkpoint generation, content: {application/zip: {schema: {type: string, format: binary}}}}
        '404': {$ref: '#/components/responses/Problem'}
  /nodes:
    get:
      security: [{sessionCookie: []}, {personalAccessToken: []}]
      operationId: listNodes
      responses:
        '200':
          description: Shared compute inventory with current reservations
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties: {items: {type: array, items: {$ref: '#/components/schemas/Node'}}}
  /nodes/{nodeId}:
    patch:
      operationId: updateNodeMetadata
      parameters:
        - {$ref: '#/components/parameters/NodeID'}
        - {$ref: '#/components/parameters/CSRFToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, labels]
              properties:
                name: {type: string, minLength: 1, maxLength: 128}
                labels: {type: object, maxProperties: 64, additionalProperties: {type: string, maxLength: 256}}
      responses:
        '200': {description: Effective node metadata updated}
        '403': {description: Administrator role required}
        '422': {description: Invalid node metadata}
    delete:
      operationId: deleteNode
      description: Remove a node from active scheduling and revoke its agent credential while retaining historical job-attempt references. Active jobs must be stopped or reconciled first.
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
      responses:
        '204': {description: Node deleted}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /nodes/{nodeId}/drain:
    post:
      operationId: drainNode
      description: Prevent an enrolled node from receiving new assignments.
      parameters: [{$ref: '#/components/parameters/NodeID'}, {$ref: '#/components/parameters/CSRFToken'}]
      responses: {'204': {description: Node is draining}, '403': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}}
  /nodes/{nodeId}/resume:
    post:
      operationId: resumeNode
      description: Return a draining node to online scheduling.
      parameters: [{$ref: '#/components/parameters/NodeID'}, {$ref: '#/components/parameters/CSRFToken'}]
      responses: {'204': {description: Node resumed}, '403': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}}
  /audit:
    get:
      operationId: listAuditEvents
      responses: {'200': {description: Administrator-only audit events}}
  /nodes/enrollment-tokens:
    post:
      operationId: createEnrollmentToken
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      responses: {'201': {description: One-time token expiring in 15 minutes}}
  /secrets:
    get:
      operationId: listSecrets
      responses: {'200': {description: Secret metadata without values, content: {application/json: {schema: {$ref: '#/components/schemas/SecretList'}}}}}
    post:
      operationId: createSecret
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateSecretRequest'}}}
      responses:
        '201': {description: Encrypted secret metadata, content: {application/json: {schema: {$ref: '#/components/schemas/SecretMetadata'}}}}
        '422': {$ref: '#/components/responses/Problem'}
  /secrets/{secretId}:
    delete:
      operationId: deleteSecret
      parameters:
        - {name: secretId, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/CSRFToken'}
      responses: {'204': {description: Secret deleted}, '404': {$ref: '#/components/responses/Problem'}}
  /agent/enroll:
    post:
      security: []
      operationId: enrollAgent
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AgentEnrollmentRequest'}}}
      responses:
        '201': {description: Node ID and rotatable agent credential, content: {application/json: {schema: {$ref: '#/components/schemas/AgentCredential'}}}}
        '401': {$ref: '#/components/responses/Problem'}
  /agent/heartbeat:
    post:
      security: [{bearerToken: []}]
      operationId: heartbeat
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/NodeInventory'}}}
      responses: {'204': {description: Inventory and heartbeat accepted}, '401': {$ref: '#/components/responses/Problem'}}
  /agent/assignments/next:
    get:
      security: [{bearerToken: []}]
      operationId: nextAssignment
      responses:
        '200':
          description: Assignment, cooperative stop requests, and pending checkpoint syncs
          content: {application/json: {schema: {$ref: '#/components/schemas/AssignmentPoll'}}}
  /agent/assignments/{assignmentId}/accept:
    post:
      security: [{bearerToken: []}]
      operationId: acceptAssignment
      parameters: [{name: assignmentId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [container_id]
              properties: {container_id: {type: string}}
      responses: {'204': {description: Container identity persisted for the assignment}, '409': {$ref: '#/components/responses/Problem'}}

  /agent/checkpoint-syncs/{syncId}/files/{path}:
    put:
      security: [{bearerToken: []}]
      operationId: uploadCheckpointChunk
      parameters:
        - {name: syncId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: path, in: path, required: true, description: Slash-separated path relative to the output directory, schema: {type: string}}
        - {$ref: '#/components/parameters/UploadOffset'}
      requestBody:
        required: true
        content: {application/octet-stream: {schema: {type: string, format: binary}}}
      responses:
        '200': {description: Chunk durably acknowledged, content: {application/json: {schema: {$ref: '#/components/schemas/UploadAcknowledgement'}}}}
        '409': {description: Resume at returned durable offset, content: {application/json: {schema: {$ref: '#/components/schemas/UploadAcknowledgement'}}}}
        '413': {description: Checkpoint storage limit reached, content: {application/json: {schema: {$ref: '#/components/schemas/UploadAcknowledgement'}}}}
  /agent/checkpoint-syncs/{syncId}/complete:
    post:
      security: [{bearerToken: []}]
      operationId: confirmCheckpointSync
      parameters: [{name: syncId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [files]
              properties: {files: {type: array, items: {$ref: '#/components/schemas/CheckpointFile'}}}
      responses: {'204': {description: Immutable checkpoint generation confirmed}, '409': {$ref: '#/components/responses/Problem'}}
  /agent/credential/rotate:
    post:
      security: [{bearerToken: []}]
      operationId: rotateAgentCredential
      responses: {'200': {description: New revocable agent credential, content: {application/json: {schema: {$ref: '#/components/schemas/AgentCredential'}}}}}
  /agent/jobs/{jobId}/events:
    post:
      security: [{bearerToken: []}]
      operationId: reportJobEvent
      parameters: [{$ref: '#/components/parameters/JobID'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AgentJobEvent'}}}
      responses: {'204': {description: Sequenced event accepted}, '403': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}}
  /agent/jobs/{jobId}/telemetry:
    post:
      security: [{bearerToken: []}]
      operationId: reportResourceTelemetry
      parameters: [{$ref: '#/components/parameters/JobID'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ResourceSample'}}}
      responses:
        '204': {description: Normalized resource sample accepted}
        '422': {$ref: '#/components/responses/Problem'}
  /agent/jobs/{jobId}/logs/{stream}:
    put:
      security: [{bearerToken: []}]
      operationId: uploadJobLogChunk
      parameters:
        - {$ref: '#/components/parameters/JobID'}
        - {$ref: '#/components/parameters/AgentLogStream'}
        - {$ref: '#/components/parameters/AttemptIDQuery'}
        - {$ref: '#/components/parameters/UploadOffset'}
      requestBody:
        required: true
        content: {application/octet-stream: {schema: {type: string, format: binary}}}
      responses:
        '200': {description: Chunk acknowledged, content: {application/json: {schema: {$ref: '#/components/schemas/UploadAcknowledgement'}}}}
        '409': {description: Offset conflict with durable next offset, content: {application/json: {schema: {$ref: '#/components/schemas/UploadAcknowledgement'}}}}
        '413': {$ref: '#/components/responses/Problem'}
  /agent/jobs/{jobId}/outputs/{path}:
    put:
      security: [{bearerToken: []}]
      operationId: uploadJobOutputChunk
      parameters:
        - {$ref: '#/components/parameters/JobID'}
        - {name: path, in: path, required: true, description: Slash-separated path relative to the output directory, schema: {type: string}}
        - {$ref: '#/components/parameters/AttemptIDQuery'}
        - {$ref: '#/components/parameters/UploadOffset'}
      requestBody:
        required: true
        content: {application/octet-stream: {schema: {type: string, format: binary}}}
      responses:
        '200': {description: Chunk acknowledged, content: {application/json: {schema: {$ref: '#/components/schemas/UploadAcknowledgement'}}}}
        '409': {description: Offset conflict with durable next offset, content: {application/json: {schema: {$ref: '#/components/schemas/UploadAcknowledgement'}}}}
        '413': {$ref: '#/components/responses/Problem'}
  /agent/jobs/{jobId}/inputs/{path}:
    get:
      security: [{bearerToken: []}]
      operationId: downloadJobInput
      description: Download one immutable manifest input for the node currently assigned to the job.
      parameters:
        - {$ref: '#/components/parameters/JobID'}
        - {name: path, in: path, required: true, description: Slash-separated path from the immutable input manifest, schema: {type: string}}
      responses:
        '200': {description: Verified input bytes, headers: {X-JobDock-Content-SHA256: {schema: {type: string, pattern: '^[0-9a-f]{64}$'}}}, content: {application/octet-stream: {schema: {type: string, format: binary}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /job-context/progress:
    post:
      security: [{bearerToken: []}]
      operationId: reportProgress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value: {type: number, format: double, minimum: 0, maximum: 1}
                milestone: {type: string}
                step: {type: integer, format: int64}
                timestamp: {type: string, format: date-time}
                metadata: {$ref: '#/components/schemas/ObservationMetadata'}
      responses: {'202': {description: Progress accepted}}
  /job-context/milestones:
    post:
      security: [{bearerToken: []}]
      operationId: defineMilestones
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, minItems: 1, maxItems: 128, items: {$ref: '#/components/schemas/Milestone'}}}}}}}
      responses: {'202': {description: Ordered milestones accepted}}
  /job-context/milestones/reached:
    post:
      security: [{bearerToken: []}]
      operationId: reachMilestone
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProgressObservation'}}}}
      responses: {'202': {description: Reached milestone accepted}}
  /job-context/matrices:
    post:
      security: [{bearerToken: []}]
      operationId: reportMatrix
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MatrixObservation'}}}}
      responses: {'202': {description: Structured matrix accepted}, '413': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}}
  /job-context/distributions:
    post:
      security: [{bearerToken: []}]
      operationId: reportDistribution
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DistributionObservationWrite'}}}}
      responses: {'202': {description: Bounded distribution snapshot accepted}, '422': {$ref: '#/components/responses/Problem'}}
  /job-context/metrics:
    post:
      security: [{bearerToken: []}]
      operationId: reportMetrics
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/MetricBatch'}}}
      responses: {'202': {description: Metrics accepted}}
  /job-context/observability/manifest:
    post:
      security: [{bearerToken: []}]
      operationId: declareObservabilityManifest
      description: Idempotently declare or extend attempt-scoped observable-source schemas and stable phases without creating samples or observations.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ObservabilityManifest'}}}
      responses:
        '202': {description: Manifest accepted, content: {application/json: {schema: {$ref: '#/components/schemas/ObservabilityManifestUpdate'}}}}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /job-context/params:
    post:
      security: [{bearerToken: []}]
      operationId: reportParameters
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ParameterBatch'}}}
      responses: {'202': {description: Parameters accepted}}
  /job-context/events:
    post:
      security: [{bearerToken: []}]
      operationId: reportSDKEvent
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SDKEvent'}}}
      responses: {'202': {description: Structured event accepted}}
  /job-context/stop:
    get:
      security: [{bearerToken: []}]
      operationId: shouldStop
      responses:
        '200':
          description: Cooperative cancellation state
          content:
            application/json:
              schema:
                type: object
                required: [should_stop]
                properties: {should_stop: {type: boolean}}
  /job-context/checkpoints:
    post:
      security: [{bearerToken: []}]
      operationId: requestCheckpointSync
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/CheckpointObservation'}}}}
      responses: {'202': {description: Checkpoint synchronization requested, content: {application/json: {schema: {$ref: '#/components/schemas/CheckpointSync'}}}}}
  /job-context/checkpoints/{syncId}:
    get:
      security: [{bearerToken: []}]
      operationId: getCheckpointSync
      parameters: [{name: syncId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: PENDING or CONFIRMED checkpoint status, content: {application/json: {schema: {$ref: '#/components/schemas/CheckpointSync'}}}}}
components:
  securitySchemes:
    sessionCookie: {type: apiKey, in: cookie, name: jobdock_session}
    bearerToken: {type: http, scheme: bearer}
    personalAccessToken: {type: http, scheme: bearer, bearerFormat: JobDock PAT}
  parameters:
    BuildID: {name: buildId, in: path, required: true, schema: {type: string, format: uuid}}
    BuildAssignmentID: {name: assignmentId, in: path, required: true, schema: {type: string, format: uuid}}
    BuilderID: {name: X-JobDock-Builder-ID, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
    JobID: {name: jobId, in: path, required: true, schema: {type: string, format: uuid}}
    AttemptIDPath: {name: attemptId, in: path, required: true, schema: {type: string, format: uuid}}
    NodeID: {name: nodeId, in: path, required: true, schema: {type: string, format: uuid}}
    CSRFToken: {name: X-CSRF-Token, in: header, required: true, schema: {type: string}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: false, schema: {type: string, minLength: 16, maxLength: 128}}
    LogStream: {name: stream, in: path, required: true, schema: {type: string, enum: [stdout, stderr]}}
    AgentLogStream: {name: stream, in: path, required: true, schema: {type: string, enum: [stdout, stderr, .order]}}
    UploadOffset: {name: offset, in: query, required: true, schema: {type: integer, format: int64, minimum: 0}}
    AttemptIDQuery: {name: attempt_id, in: query, description: Defaults to the current attempt, schema: {type: string, format: uuid}}
    SeriesFrom: {name: from, in: query, description: Inclusive RFC3339 start, schema: {type: string, format: date-time}}
    SeriesTo: {name: to, in: query, description: Inclusive RFC3339 end, schema: {type: string, format: date-time}}
    SeriesLimit: {name: limit, in: query, description: Global maximum number of returned points, schema: {type: integer, minimum: 1, maximum: 10000, default: 2000}}
    SeriesCursor: {name: cursor, in: query, description: Consistent snapshot cursor; defaults to the latest cursor for the attempt, schema: {type: integer, format: int64, minimum: 0}}
  responses:
    Problem:
      description: RFC 9457-style problem detail
      content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties: {username: {type: string}, password: {type: string, format: password}}
    Session:
      type: object
      required: [user, csrf_token]
      properties: {user: {$ref: '#/components/schemas/User'}, csrf_token: {type: string}}
    User:
      type: object
      required: [id, username, role, created_at]
      properties:
        id: {type: string, format: uuid}
        username: {type: string}
        role: {type: string, enum: [admin, member]}
        created_at: {type: string, format: date-time}
    UserList:
      type: object
      required: [items]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/User'}}}
    PersonalAccessToken:
      type: object
      required: [id, user_id, name, prefix, scopes, created_at]
