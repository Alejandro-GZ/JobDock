name: Publish release images

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      sdk_version: ${{ steps.sdk.outputs.version }}
      stable: ${{ steps.release.outputs.stable }}
    steps:
      - uses: actions/checkout@v4
      - id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Release tag must be a SemVer tag such as v0.1.0 or v0.2.0-rc.1" >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          stable=true
          if [[ "$version" == *-* ]]; then
            stable=false
            prerelease="${version#*-}"
            IFS='.' read -ra identifiers <<< "$prerelease"
            for identifier in "${identifiers[@]}"; do
              if [[ "$identifier" =~ ^[0-9]+$ && "$identifier" != "0" && "$identifier" == 0* ]]; then
                echo "Numeric prerelease identifiers must not contain leading zeroes" >&2
                exit 1
              fi
            done
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "stable=$stable" >> "$GITHUB_OUTPUT"
      - id: sdk
        name: Derive Python SDK version
        env:
          JOBDOCK_RELEASE_TAG: ${{ github.ref_name }}
          JOBDOCK_PRODUCT_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          sdk_version="$(python3 sdk/python/versioning.py)"
          test -n "$sdk_version"
          echo "version=$sdk_version" >> "$GITHUB_OUTPUT"
          echo "Python SDK version: ${sdk_version}" >> "$GITHUB_STEP_SUMMARY"

  quality:
    name: Required CI
    needs: validate
    uses: ./.github/workflows/ci.yml

  sdk-package:
    name: Build and validate Python SDK artifacts
    needs: [validate, quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Install packaging tools
        run: python -m pip install --disable-pip-version-check build==1.3.0 twine==6.2.0
      - name: Build wheel and source distribution once
        env:
          JOBDOCK_RELEASE_TAG: ${{ github.ref_name }}
          JOBDOCK_PRODUCT_VERSION: ${{ needs.validate.outputs.version }}
          JOBDOCK_SDK_VERSION: ${{ needs.validate.outputs.sdk_version }}
        run: python -m build --wheel --sdist sdk/python --outdir sdk-dist/packages
      - name: Validate package metadata and artifact identity
        env:
          SDK_VERSION: ${{ needs.validate.outputs.sdk_version }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t wheels < <(find sdk-dist/packages -maxdepth 1 -type f -name '*.whl')
          mapfile -t sdists < <(find sdk-dist/packages -maxdepth 1 -type f -name '*.tar.gz')
          test "${#wheels[@]}" -eq 1
          test "${#sdists[@]}" -eq 1
          [[ "$(basename "${wheels[0]}")" == "jobdock_sdk-${SDK_VERSION}-"*.whl ]]
          test "$(basename "${sdists[0]}")" = "jobdock_sdk-${SDK_VERSION}.tar.gz"
          python -m twine check "${wheels[0]}" "${sdists[0]}"
      - name: Install wheel in a clean environment and smoke test it
        env:
          SDK_VERSION: ${{ needs.validate.outputs.sdk_version }}
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/jobdock-sdk-smoke"
          "$RUNNER_TEMP/jobdock-sdk-smoke/bin/python" -m pip install --disable-pip-version-check --no-deps sdk-dist/packages/*.whl
          actual_version="$("$RUNNER_TEMP/jobdock-sdk-smoke/bin/python" -c 'import jobdock; from importlib.metadata import metadata; assert metadata("jobdock-sdk")["Name"] == "jobdock-sdk"; print(jobdock.__version__)')"
          test "$actual_version" = "$SDK_VERSION"
      - name: Generate and verify SHA-256 checksums
        working-directory: sdk-dist
        run: |
          sha256sum packages/*.whl packages/*.tar.gz > SHA256SUMS.sdk
          sha256sum --check SHA256SUMS.sdk
      - name: Preserve validated SDK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jobdock-sdk-${{ needs.validate.outputs.sdk_version }}
          path: sdk-dist/
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish ${{ matrix.image }}
    needs: [validate, sdk-package]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: jobdock-server
            dockerfile: Dockerfile.server
          - image: jobdock-agent
            dockerfile: Dockerfile.agent
          - image: jobdock-builder
            dockerfile: Dockerfile.builder
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/alejandro-gz/${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.validate.outputs.stable == 'true' }}
            type=raw,value=latest,enable=${{ needs.validate.outputs.stable == 'true' }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          build-args: VERSION=${{ needs.validate.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Record immutable digest
        env:
          IMAGE: ghcr.io/alejandro-gz/${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-digest
          jq -n \
            --arg image "$IMAGE" \
            --arg digest "$DIGEST" \
            --arg reference "${IMAGE}@${DIGEST}" \
            '{image: $image, digest: $digest, reference: $reference}' \
            > "release-digest/${{ matrix.image }}.json"
          echo "${IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve immutable digest
        uses: actions/upload-artifact@v4
        with:
          name: release-digest-${{ matrix.image }}
          path: release-digest/${{ matrix.image }}.json
          if-no-files-found: error
          retention-days: 30

  verify:
    name: Verify published release set
    needs: [validate, publish]
    runs-on: ubuntu-latest
    outputs:
      manifest: ${{ steps.manifest.outputs.manifest }}
      server_digest: ${{ steps.manifest.outputs.server_digest }}
      agent_digest: ${{ steps.manifest.outputs.agent_digest }}
      builder_digest: ${{ steps.manifest.outputs.builder_digest }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-digest-*
          path: release-digests
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: jobdock-sdk-${{ needs.validate.outputs.sdk_version }}
          path: sdk-dist
      - id: manifest
        name: Assemble release digest manifest
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          SDK_VERSION: ${{ needs.validate.outputs.sdk_version }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(find release-digests -maxdepth 1 -name 'jobdock-*.json' | wc -l)" -eq 3
          (cd sdk-dist && sha256sum --check SHA256SUMS.sdk)
          mapfile -t wheels < <(find sdk-dist/packages -maxdepth 1 -type f -name '*.whl')
          mapfile -t sdists < <(find sdk-dist/packages -maxdepth 1 -type f -name '*.tar.gz')
          test "${#wheels[@]}" -eq 1
          test "${#sdists[@]}" -eq 1
          wheel_file="$(basename "${wheels[0]}")"
          sdist_file="$(basename "${sdists[0]}")"
          wheel_sha256="$(sha256sum "${wheels[0]}" | cut -d ' ' -f 1)"
          sdist_sha256="$(sha256sum "${sdists[0]}" | cut -d ' ' -f 1)"
          jq -s \
            --arg version "$VERSION" \
            --arg tag "$GITHUB_REF_NAME" \
            --arg commit "$GITHUB_SHA" \
            --arg sdk_version "$SDK_VERSION" \
            --arg wheel_file "$wheel_file" \
            --arg wheel_sha256 "$wheel_sha256" \
            --arg sdist_file "$sdist_file" \
            --arg sdist_sha256 "$sdist_sha256" \
            '{schema_version: 2, version: $version, tag: $tag, commit: $commit, images: (sort_by(.image)), sdk: {name: "jobdock-sdk", version: $sdk_version, wheel: {filename: $wheel_file, sha256: $wheel_sha256}, sdist: {filename: $sdist_file, sha256: $sdist_sha256}}}' \
            release-digests/jobdock-*.json > release-manifest.json
          {
            echo "manifest=$(jq -c . release-manifest.json)"
            echo "server_digest=$(jq -r 'select(.image | endswith("/jobdock-server")) | .digest' release-digests/jobdock-server.json)"
            echo "agent_digest=$(jq -r 'select(.image | endswith("/jobdock-agent")) | .digest' release-digests/jobdock-agent.json)"
            echo "builder_digest=$(jq -r 'select(.image | endswith("/jobdock-builder")) | .digest' release-digests/jobdock-builder.json)"
          } >> "$GITHUB_OUTPUT"
      - name: Pull published digests and verify exact-version tags
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          for file in release-digests/jobdock-*.json; do
            image="$(jq -r .image "$file")"
            digest="$(jq -r .digest "$file")"
            reference="$(jq -r .reference "$file")"
            docker pull "$reference"
            actual_version="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$reference")"
            test "$actual_version" = "$VERSION"
            tag_digest="$(docker buildx imagetools inspect "${image}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)"
            test "$tag_digest" = "$digest"
          done
      - name: Preserve release manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ needs.validate.outputs.version }}
          path: release-manifest.json
          if-no-files-found: error
          retention-days: 90

  release:
    name: Create GitHub Release
    needs: [validate, verify, release-e2e, sdk-package, verify-sdk-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-manifest-${{ needs.validate.outputs.version }}
      - uses: actions/download-artifact@v4
        with:
          name: jobdock-sdk-${{ needs.validate.outputs.sdk_version }}
          path: sdk-dist
      - name: Verify preserved SDK artifacts
        working-directory: sdk-dist
        run: sha256sum --check SHA256SUMS.sdk
      - name: Prepare self-contained release assets
        run: sh deploy/prepare-release-assets.sh release-manifest.json release-assets sdk-dist/packages
      - name: Validate release asset checksums
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS
      - name: Create release from the verified package set
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
          STABLE: ${{ needs.validate.outputs.stable }}
        shell: bash
        run: |
          set -euo pipefail
          prerelease=()
          latest=(--latest)
          if [[ "$STABLE" != "true" ]]; then
            prerelease=(--prerelease)
            latest=(--latest=false)
          fi
          notes="$(cat release-assets/release-notes.md)"
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "JobDock ${VERSION}" \
            --generate-notes \
            --notes "$notes" \
            "${prerelease[@]}" \
            "${latest[@]}" \
            release-assets/release-manifest.json \
            release-assets/docker-compose.yml \
            release-assets/install-agent.sh \
            release-assets/SHA256SUMS \
            release-assets/*.whl \
            release-assets/*.tar.gz

  publish-sdk-pypi:
    name: Publish Python SDK to PyPI
    needs: [validate, sdk-package, verify, release-e2e]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/jobdock-sdk/${{ needs.validate.outputs.sdk_version }}/
    permissions:
      id-token: write
    steps:
      - name: Retrieve validated SDK distributions
        uses: actions/download-artifact@v4
        with:
          name: jobdock-sdk-${{ needs.validate.outputs.sdk_version }}
          path: sdk-dist
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk-dist/packages

  verify-sdk-pypi:
    name: Verify Python SDK from PyPI
    needs: [validate, publish-sdk-pypi]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Resolve and install the exact published version
        env:
          SDK_VERSION: ${{ needs.validate.outputs.sdk_version }}
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/jobdock-sdk-pypi"
          for attempt in 1 2 3 4 5 6; do
            if "$RUNNER_TEMP/jobdock-sdk-pypi/bin/python" -m pip install \
              --disable-pip-version-check \
              --no-cache-dir \
              --only-binary=:all: \
              --index-url=https://pypi.org/simple \
              "jobdock-sdk==${SDK_VERSION}"; then
              break
            fi
            if [ "$attempt" -eq 6 ]; then
              exit 1
            fi
            sleep 10
          done
          actual_version="$("$RUNNER_TEMP/jobdock-sdk-pypi/bin/python" -c 'import jobdock; from importlib.metadata import version; assert version("jobdock-sdk") == jobdock.__version__; print(jobdock.__version__)')"
          test "$actual_version" = "$SDK_VERSION"

  release-e2e:
    name: Validate published release end to end
    needs: [validate, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Exercise published server, builder, and agent
        env:
          JOBDOCK_RELEASE_SERVER_IMAGE: ghcr.io/alejandro-gz/jobdock-server@${{ needs.verify.outputs.server_digest }}
          JOBDOCK_RELEASE_AGENT_IMAGE: ghcr.io/alejandro-gz/jobdock-agent@${{ needs.verify.outputs.agent_digest }}
          JOBDOCK_RELEASE_BUILDER_IMAGE: ghcr.io/alejandro-gz/jobdock-builder@${{ needs.verify.outputs.builder_digest }}
        run: python3 tests/release_e2e.py
